name: Frontend CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript with ESLint
        run: npx eslint frontend/

      - name: Check code formatting with Prettier
        run: npx prettier --check 'frontend/**/*.{js,css}'

      - name: Validate HTML with html-validate
        run: npx html-validate frontend/index.html
