version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    delete-dependent-on-merge: true

  # Composer (PHP backend dependencies)
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    delete-dependent-on-merge: true

  # npm (frontend dependencies)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    delete-dependent-on-merge: true

  # Gradle (Android app dependencies)
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    delete-dependent-on-merge: true

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    delete-dependent-on-merge: true
