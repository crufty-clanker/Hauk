version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    delete-dependent-on-merge: true
    groups:
      github-actions:
        patterns:
          - "*"

  # Composer (PHP backend dependencies)
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    delete-dependent-on-merge: true
    groups:
      php-backend:
        patterns:
          - "*"

  # npm (frontend dependencies)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    delete-dependent-on-merge: true
    groups:
      frontend:
        patterns:
          - "*"

  # Gradle (Android app dependencies)
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    delete-dependent-on-merge: true
    groups:
      android-app:
        patterns:
          - "*"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    delete-dependent-on-merge: true
    groups:
      docker:
        patterns:
          - "*"


